<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo Liste - Projets</title>
  <style>
    :root {
      --hue: 220;
      --bg: hsl(var(--hue), 25%, 8%);
      --card: hsl(var(--hue), 25%, 14%);
      --card-item: hsl(var(--hue), 25%, 10%);
      --text: hsl(var(--hue), 10%, 95%);
      --muted: hsl(var(--hue), 10%, 65%);
      --accent: hsl(var(--hue), 75%, 60%);
      --accent-hover: hsl(var(--hue), 75%, 50%);
      --border: hsl(var(--hue), 20%, 25%);
      --success: hsl(140, 70%, 50%);
      --danger: hsl(350, 70%, 60%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .container { max-width: 640px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
    p.subtitle { color: var(--muted); font-size: 0.95rem; }

    .theme-controls {
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .theme-controls label { display: flex; align-items: center; gap: 0.4rem; }
    .theme-controls input[type="range"] { accent-color: var(--accent); width: 120px; }
    .theme-controls button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .theme-controls button:hover { border-color: var(--accent); }

    .project-bar {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .project-bar input[type="text"] {
      padding: 0.55rem 0.85rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      outline: none;
    }
    .project-bar input[type="text"]:focus { border-color: var(--accent); }
    .project-tabs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      overflow-x: auto;
      padding-bottom: 0.4rem;
    }
    .project-tab {
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      white-space: nowrap;
      transition: transform 0.1s, opacity 0.2s;
    }
    .project-tab:hover { opacity: 0.9; transform: translateY(-1px); }
    .project-tab.active { outline: 2px solid #fff; outline-offset: 2px; }
    .project-tab .remove {
      margin-left: 0.4rem;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }
    .btn-add-project {
      padding: 0.5rem 0.9rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.2s;
    }
    .btn-add-project:hover { background: var(--accent-hover); }

    .todo-card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    .input-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.85rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button.add {
      padding: 0.6rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button.add:hover { background: var(--accent-hover); }
    button.add:active { transform: scale(0.97); }

    ul.todos { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
    li.todo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-item);
      transition: all 0.2s;
    }
    li.todo:hover { border-color: hsl(var(--hue), 20%, 35%); }
    li.todo.completed { opacity: 0.55; }
    li.todo.completed .label { text-decoration: line-through; color: var(--muted); }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .label { flex: 1; font-size: 1rem; word-break: break-word; }

    .delete {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.25rem;
      line-height: 1;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .delete:hover { opacity: 1; }

    .stats {
      margin-top: 1rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
      align-items: center;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: hsla(var(--hue), 75%, 40%, 0.15);
      color: var(--accent);
    }
    .badge.done { background: hsla(140, 70%, 50%, 0.15); color: var(--success); }
    .badge.todo { background: hsla(45, 80%, 55%, 0.15); color: hsl(45, 80%, 55%); }

    #refreshBtn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: border-color 0.2s;
    }
    #refreshBtn:hover { border-color: var(--accent); }

    #syncStatus { font-size: 0.7rem; color: var(--muted); }

    .empty { text-align: center; color: var(--muted); padding: 2rem; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📝 Ma Todo Liste</h1>
    <p class="subtitle">Organise tes tâches par projet</p>
    <div class="theme-controls">
      <label>Teinte HSL <input type="range" id="hueSlider" min="0" max="360" value="220"></label>
      <button id="themeToggle" title="Basculer clair/sombre">🌙</button>
    </div>
  </header>

  <div class="project-bar">
    <input type="text" id="projectSearch" placeholder="Rechercher un projet…" />
    <div class="project-tabs" id="projectTabs"></div>
    <button class="btn-add-project" id="addProjectBtn">+ Nouveau projet</button>
  </div>

  <div class="todo-card">
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="Ajouter une tâche…" />
      <button class="add" id="addBtn">Ajouter</button>
    </div>
    <ul class="todos" id="todoList"></ul>
    <div class="stats">
      <span><span class="badge total" id="totalCount">0</span> tâche(s)</span>
      <span><span class="badge done" id="doneCount">0</span> complétée(s)</span>
      <span><span class="badge todo" id="todoCount">0</span> restante(s)</span>
      <button id="refreshBtn" title="Actualiser">⟳</button>
      <span id="syncStatus">—</span>
    </div>
  </div>
</div>

<script>
  const API = '/api/todos';
  const PROJECTS_API = '/api/projects';
  const input = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const projectSearch = document.getElementById('projectSearch');
  const projectTabs = document.getElementById('projectTabs');
  const addProjectBtn = document.getElementById('addProjectBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const syncStatus = document.getElementById('syncStatus');
  const list = document.getElementById('todoList');
  const totalEl = document.getElementById('totalCount');
  const doneEl = document.getElementById('doneCount');
  const todoEl = document.getElementById('todoCount');
  const hueSlider = document.getElementById('hueSlider');
  const themeToggle = document.getElementById('themeToggle');

  let todos = [];
  let projects = [];
  let currentProjectId = 0; // 0 = "Tous"
  let pollInterval = null;
  const POLL_MS = 3000;

  // Thème HSL
  hueSlider.addEventListener('input', (e) => {
    document.documentElement.style.setProperty('--hue', e.target.value);
  });

  let isDark = true;
  themeToggle.addEventListener('click', () => {
    isDark = !isDark;
    document.documentElement.style.setProperty('--bg', isDark ? 'hsl(var(--hue), 25%, 8%)' : 'hsl(var(--hue), 20%, 95%)');
    document.documentElement.style.setProperty('--card', isDark ? 'hsl(var(--hue), 25%, 14%)' : '#ffffff');
    document.documentElement.style.setProperty('--card-item', isDark ? 'hsl(var(--hue), 25%, 10%)' : '#f8fafc');
    document.documentElement.style.setProperty('--text', isDark ? 'hsl(var(--hue), 10%, 95%)' : 'hsl(var(--hue), 10%, 15%)');
    document.documentElement.style.setProperty('--muted', isDark ? 'hsl(var(--hue), 10%, 65%)' : 'hsl(var(--hue), 10%, 50%)');
    document.documentElement.style.setProperty('--border', isDark ? 'hsl(var(--hue), 20%, 25%)' : 'hsl(var(--hue), 20%, 85%)');
    themeToggle.textContent = isDark ? '🌙' : '☀️';
  });

  // Projets
  async function fetchProjects() {
    const res = await fetch(PROJECTS_API);
    projects = await res.json();
    renderProjectTabs();
  }

  function renderProjectTabs() {
    const search = projectSearch.value.toLowerCase();
    projectTabs.innerHTML = '';
    projects.filter(p => p.name.toLowerCase().includes(search)).forEach(p => {
      const btn = document.createElement('button');
      btn.className = `project-tab ${currentProjectId === p.id ? 'active' : ''}`;
      btn.style.backgroundColor = p.color;
      btn.innerHTML = p.name + (p.id !== 0 ? ' <span class="remove" title="Supprimer ce projet">×</span>' : '');
      btn.onclick = (e) => {
        if (e.target.classList.contains('remove')) {
          e.stopPropagation();
          deleteProject(p.id);
          return;
        }
        currentProjectId = p.id;
        renderProjectTabs();
        fetchTodos();
      };
      projectTabs.appendChild(btn);
    });
  }

  projectSearch.addEventListener('input', renderProjectTabs);

  addProjectBtn.addEventListener('click', async () => {
    const name = prompt('Nom du nouveau projet :');
    if (!name || !name.trim()) return;
    const color = prompt('Couleur HEX (ex: #2563eb) :', '#2563eb') || '#2563eb';
    const res = await fetch(PROJECTS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim(), color }),
    });
    const project = await res.json();
    projects.push(project);
    currentProjectId = project.id;
    renderProjectTabs();
    fetchTodos();
  });

  async function deleteProject(id) {
    if (id === 0) { alert('Impossible de supprimer "Tous"'); return; }
    if (!confirm('Supprimer ce projet ? Les tâches seront déplacées vers "Tous".')) return;
    await fetch(`${PROJECTS_API}/${id}`, { method: 'DELETE' });
    projects = projects.filter(p => p.id !== id);
    if (currentProjectId === id) currentProjectId = 0;
    renderProjectTabs();
    fetchTodos();
  }

  // Todos
  async function fetchTodos() {
    const params = currentProjectId ? `?projectId=${currentProjectId}` : '';
    const res = await fetch(API + params);
    todos = await res.json();
    render();
    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    syncStatus.textContent = `Synchro : ${now}`;
  }

  async function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, projectId: currentProjectId || 0 }),
    });
    const created = await res.json();
    input.value = '';
    todos.push(created);
    render();
  }

  async function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (!t) return;
    await fetch(`${API}/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done: !t.done }),
    });
    await fetchTodos();
  }

  async function deleteTodo(id) {
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    todos = todos.filter(t => t.id !== id);
    render();
  }

  function render() {
    list.innerHTML = '';
    if (todos.length === 0) {
      list.innerHTML = '<li class="empty">Aucune tâche pour ce projet. Ajoute-en une ci-dessus !</li>';
    } else {
      todos.forEach(t => {
        const li = document.createElement('li');
        li.className = `todo ${t.done ? 'completed' : ''}`;
        li.innerHTML = `
          <input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Marquer comme ${t.done ? 'à faire' : 'terminé'}" />
          <span class="label">${escapeHtml(t.text)}</span>
          <button class="delete" aria-label="Supprimer">×</button>
        `;
        const checkbox = li.querySelector('input[type="checkbox"]');
        checkbox.addEventListener('change', () => toggleTodo(t.id));
        const del = li.querySelector('.delete');
        del.addEventListener('click', () => deleteTodo(t.id));
        list.appendChild(li);
      });
    }
    const total = todos.length;
    const done = todos.filter(t => t.done).length;
    totalEl.textContent = total;
    doneEl.textContent = done;
    todoEl.textContent = total - done;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Polling périodique
  function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(fetchTodos, POLL_MS);
  }
  function stopPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = null;
  }

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTodo(); });
  refreshBtn.addEventListener('click', fetchTodos);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') startPolling();
    else stopPolling();
  });

  startPolling();
  Promise.all([fetchProjects(), fetchTodos()]);
</script>
</body>
</html>
